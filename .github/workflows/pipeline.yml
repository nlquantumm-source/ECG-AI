# ==========================================
      # --- CI PIPELINE (Continuous Integration) ---
      # ==========================================

name: ECG-AI CI Pipeline

# This tells GitHub to run the pipeline every time you "push" code to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # We use a virtual Ubuntu Linux machine to run our tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code onto the virtual machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python so we can run your AI Notebook
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Step 3: Install the libraries your AI needs
      - name: Install AI Dependencies
        run: |
          pip install numpy tensorflow matplotlib nbconvert jupyter

      # Step 4: Run the Notebook to generate fresh "model_weights.h"
      # This ensures your C code always has the latest AI math
      - name: Export AI Weights
        run: |
          jupyter nbconvert --to script notebooks/Bare_Model_AI.ipynb
          python notebooks/Bare_Model_AI.py

      # Step 5: Compile your C code to make sure there are no syntax errors
      - name: Run Logic Test
        run: |
          # Compile the engine AND the test runner together
          gcc src/ecg_ai.c tests/test_runner.c -Isrc -lm -o logic_test
          # Actually run the program
          ./logic_test

# ==========================================
      # --- CD PIPELINE (Continuous Delivery) ---
      # ==========================================

      # Step 7: Security Acceptance (Static Analysis)
      - name: Install Security Tools
        run: sudo apt-get install cppcheck

      - name: Security Scan (C Code)
        run: |
          # Scans your C files for bugs, memory leaks, and style issues
          cppcheck src/ --error-exitcode=1

      # Step 9: Performance & Memory Check
      - name: Check Memory Footprint
        run: |
          echo "Measuring firmware size..."
          # The 'size' command checks how much RAM/Flash your code uses
          size ecg_firmware_check
          
      # Step 10 & 11: Production Deployment (Release Packaging)
      # We gather the tested files into a clean folder for flashing
      - name: Create Production Package
        run: |
          mkdir ecg_production_release
          cp src/model_weights.h ecg_production_release/
          cp src/Final_ECG_v001.c ecg_production_release/
          cp src/ecg_ai.c ecg_production_release/
          cp src/ecg_ai.h ecg_production_release/
          # Create a zip file of the release
          zip -r ecg_firmware_production.zip ecg_production_release/

      - name: Upload Production Environment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecg-production-firmware
          path: ecg_firmware_production.zip
